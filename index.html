/* Layout: the game is one pixel-art stage; HUD, actions and cards live inside it. The map opens as its own full-screen view. */
:root{

}
*{box-sizing:border-box}

p{margin:0 0 10px}.dim{color:var(--dim)}
.stagewrap{position:relative;width:100%;background:#000;border:2px solid #000;outline:1px solid var(--line);overflow:hidden}
img,canvas,.sprite{image-rendering:pixelated;image-rendering:crisp-edges;filter:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;background:#000}
#cv{width:100%;height:auto;aspect-ratio:16/9}

.hbars{display:grid;gap:3px}
.bar{display:grid;grid-template-columns:22px 92px auto;align-items:center;gap:3px;font-size:12px}
.bar b{color:#d8caa8;font-weight:700}

.tr{height:8px;background:#0e0b08;border:1px solid #5a4a36}

.hr{display:flex;flex-direction:column;align-items:stretch;gap:6px;flex:none}.hr button{text-align:left}

.log p{font-size:14.5px;color:var(--dim);margin:0 0 3px}.log p:first-of-type{color:var(--ink)}

#mapov{position:fixed;inset:0;z-index:55;background:#0a0705;display:flex;align-items:center;justify-content:center;padding:10px}

.mapbox canvas{width:100%;height:auto;aspect-ratio:16/9;border:3px solid #3a2a18}

.ml{position:absolute;pointer-events:auto;transform:translate(-50%,0);background:rgba(25,18,10,.86);border:1px solid #6a5535;color:#f1e3c0;font:700 12px var(--body);padding:1px 6px;white-space:nowrap;cursor:pointer;min-height:0;box-shadow:none}
.ml small{color:#e0bb5e;font-size:12px;margin-left:4px}
.ml.sel{border-color:var(--gold);background:#5a4020}.ml.cur{border-color:var(--moss)}
.mapttl{position:absolute;left:12px;top:10px;font:400 26px var(--display);color:#4a301c;text-shadow:0 1px 0 rgba(255,240,200,.5);pointer-events:none}
#mapbar{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;background:linear-gradient(rgba(10,7,4,0),rgba(10,7,4,.92) 40%);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
#mapbar .bt{flex:1;min-width:200px;font-size:15px}#mapbar .bt small{display:block;color:#cbbf9f}#mapbar .btns{margin:0}

const _lcf=s=>s?s[0].toLowerCase()+s.slice(1):s;
let I18N_RE=null,I18N_MAP=null,I18N_CACHE=new Map();
function i18nBuild(){
  const m=new Map();
  for(const[a,b]of I18N_N){if(!m.has(a))m.set(a,b);const la=_lcf(a);if(la!==a&&!m.has(la))m.set(la,_lcf(b))}
  for(const[a,b]of I18N_C)m.set(a,b);
  I18N_MAP=m;
  const keys=[...m.keys()].filter(k=>k).sort((a,b)=>b.length-a.length);
  const esc=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
  const L=/\p{L}/u;
  I18N_RE=new RegExp(keys.map(k=>(L.test(k[0])?'(?<![\\p{L}\\p{N}])':'')+esc(k)+(L.test(k[k.length-1])?'(?![\\p{L}])':'')).join('|'),'gu');
}
function TR(s){
  if(LANG==='pt'||typeof s!=='string'||!s)return s;
  let r=I18N_CACHE.get(s);if(r!==undefined)return r;
  if(!I18N_RE)i18nBuild();
  r=s.replace(I18N_RE,x=>I18N_MAP.get(x)||x);
  if(I18N_CACHE.size>4000)I18N_CACHE.clear();
  I18N_CACHE.set(s,r);return r;
}
(function(){

  const t=Object.getOwnPropertyDescriptor(Node.prototype,'textContent');
  Object.defineProperty(Node.prototype,'textContent',{get:t.get,set(v){t.set.call(this,LANG==='pt'||typeof v!=='string'?v:TR(v))},configurable:true});
  const P=CanvasRenderingContext2D.prototype;
  for(const f of['fillText','strokeText','measureText']){const o=P[f];P[f]=function(s,...r){return o.call(this,LANG==='pt'?s:TR(String(s)),...r)}}
})();
const STATIC_ORIG=new WeakMap();
function i18nStatic(){
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
  const roots=['#mapov'].map(s=>document.querySelector(s)).filter(Boolean);
  for(const r of roots){
    const tw=document.createTreeWalker(r,NodeFilter.SHOW_TEXT);
    while(n=tw.nextNode()){if(!STATIC_ORIG.has(n))STATIC_ORIG.set(n,n.nodeValue);const o=STATIC_ORIG.get(n);n.nodeValue=LANG==='pt'?o:TR(o)}
    r.querySelectorAll('[aria-label],[title]').forEach(e=>{for(const a of['aria-label','title']){if(!e.hasAttribute(a))continue;const k='data-o-'+a;if(!e.hasAttribute(k))e.setAttribute(k,e.getAttribute(a));const o=e.getAttribute(k);e.setAttribute(a,LANG==='pt'?o:TR(o))}});
  }

}

/* ---- Texturas ---- */
function speck(x,y,w,h,col,n,seed){n=Math.ceil(n*.4);for(let i=0;i<n;i++)rc(x+h01(seed*977+i*3)*w,y+h01(seed*313+i*7+1)*h,.5,.5,col)}
function bricks(x,y,w,h,base,seed){
  rc(x,y,w,h,base);const dk=shade(base,-26),lt=shade(base,16);
  for(let r=0;r*3<h;r++){rc(x,y+r*3,w,.5,dk);const off=(r%2)*2.5;for(let k=off;k<w;k+=5)rc(x+k,y+r*3,.5,Math.min(3,h-r*3),dk)}
  speck(x,y,w,h,lt,Math.floor(w*h/5),seed,1);speck(x,y,w,h,dk,Math.floor(w*h/7),seed+5,1);
  rc(x,y,w,.5,lt);rc(x,y+h-1,w,1,shade(base,-32));rc(x+w-1,y,1,h,shade(base,-18));rc(x,y,.5,h,lt);
}
function planks(x,y,w,h,base,seed){
  rc(x,y,w,h,base);const d=shade(base,-24),l=shade(base,14);
  for(let k=0;k<w;k+=3){rc(x+k,y,.5,h,d);rc(x+k+1,y,.5,h,l)}
  speck(x,y,w,h,d,Math.floor(w*h/9),seed,1);
  for(let k=1;k<w-1;k+=6){rc(x+k,y+1,.5,.5,'#2a1c10');rc(x+k,y+h-2,.5,.5,'#2a1c10')}
  rc(x,y+h-1,w,1,shade(base,-30));
}
function shingles(cx,topY,w,rh,col){
  for(let r=0;r<rh;r++){const ww=4+(w+6)*r/rh,x0=cx-ww/2;rc(x0,topY+r,ww,1,col);
    if(r%2===0){for(let k=0;k<ww;k+=2)rc(x0+k,topY+r+.5,1.5,.5,shade(col,-28))}else{for(let k=1;k<ww;k+=2)rc(x0+k,topY+r,.5,.5,shade(col,18))}
    rc(x0,topY+r,.5,1,shade(col,20));rc(x0+ww-.5,topY+r,.5,1,shade(col,-36))}
  rc(cx-w/2-3,topY+rh,w+6,1,shade(col,-44));
}
function windowF(x,y,w,h,lit){
  rc(x-.5,y-.5,w+1,h+1,'#2a1c10');rc(x,y,w,h,lit?'#f4c85a':'#35506a');rc(x,y,w,.5,lit?'#ffe9a0':'#6f94b4');
  rc(x+w/2-.25,y,.5,h,'#2a1c10');rc(x,y+h/2-.25,w,.5,'#2a1c10');rc(x-2,y,1.5,h,'#6a4528');rc(x+w+.5,y,1.5,h,'#6a4528');
}
function doorWood(x,y,w,h){planks(x,y,w,h,'#4a301c',3);rc(x,y,w,.5,'#1a1008');rc(x,y+2,w,.5,'#222');rc(x,y+h-3,w,.5,'#222');rc(x+w-2,y+h/2,1,1,'#c8b070')}
let NOSG=false;
function shadowG(x,y,w,n){if(NOSG)return;c.globalAlpha=.16;for(let i=0;i<(n||3);i++)rc(x+i,y+i*.5,w-i*2,.5,'#000');c.globalAlpha=1}
function archShape(x,y,w,h,col){rc(x,y+w/2,w,h-w/2,col);for(let r=0;r<w/2;r++){const ww=Math.sqrt(Math.pow(w/2,2)-Math.pow(w/2-r,2))*2;rc(x+w/2-ww/2,y+r,ww,1,col)}}
function barrel(x,y){planks(x,y-8,7,8,'#7a5230',x);rc(x,y-6,7,.5,'#3a3a3a');rc(x,y-2,7,.5,'#3a3a3a');rc(x+.5,y-8,6,.5,'#9a6a3c')}
function crate(x,y,w,h){planks(x,y-h,w,h,'#8a6038',w);rc(x,y-h,w,.5,'#aa7a48');rc(x,y-h,.5,h,'#4a301c');rc(x+w-.5,y-h,.5,h,'#4a301c');line(x,y-h,x+w,y,'#5a3e22')}
function ivy(x,y,w,h,seed){for(let i=0;i<w*h/6;i++){const px=x+h01(seed*7+i*3)*w,py=y+h01(seed*11+i*5)*h;rc(px,py,1,1,i%3?'#4a7a3a':'#6a9a4a');if(i%4===0)rc(px,py+1,.5,2,'#3a6a2a')}}

/* ---- Faixa de chão (grama + estrada), repetível ---- */
const stripCache={};
function roadStrip(biome){
  if(stripCache[biome])return stripCache[biome];
  const B=BIO[biome]||BIO.plain;
  return stripCache[biome]=layer(W,80,()=>{
    rc(0,0,W,80,B.g1);
    for(let i=0;i<1100;i++){rc(h01(i*3+1)*W,h01(i*7+2)*80,.5,1,[B.g2,shade(B.g1,14),shade(B.g1,-8)][i%3])}
    for(let i=0;i<70;i++){const x=h01(i*5)*W,y=2+h01(i*9)*10;rc(x,y,.5,2,shade(B.g2,-10));rc(x+1,y+1,.5,1.5,shade(B.g1,20))}
    const top=14,bot=31,TWO=Math.PI*2;
    const eT=x=>Math.sin(x/W*TWO*35)*.9+Math.sin(x/W*TWO*97)*.5+h01(Math.floor(x*2))*.7;
    const eB=x=>Math.sin(x/W*TWO*28+1)*.9+Math.sin(x/W*TWO*83)*.5+h01(Math.floor(x*2)+999)*.7;
    for(let x=0;x<W;x+=.5){const t0=top+eT(x),b0=bot+eB(x);rc(x,t0,.5,b0-t0,B.road);rc(x,t0,.5,.5,shade(B.road,-30));rc(x,b0-.5,.5,.5,shade(B.road,-24))}
    for(let i=0;i<1700;i++){const x=h01(i*11)*W,y=top+1.5+h01(i*13+4)*(bot-top-2.5);rc(x,y,.5,.5,[shade(B.road,-18),shade(B.road,16),shade(B.road,-8),shade(B.road,26)][i%4])}
    for(const [yy,ph] of [[top+5,0],[top+11.5,2]]){for(let x=0;x<W;x+=.5){const y=yy+Math.sin(x/W*TWO*6+ph)*.8;rc(x,y,.5,.5,shade(B.road,-34));if(Math.floor(x)%7===0)rc(x,y+.5,1,.5,shade(B.road,12))}}
    for(let i=0;i<46;i++){const x=h01(i*17+3)*W,y=top+2+h01(i*19)*(bot-top-4),s=1+h01(i)*1.5;rc(x,y,s+.5,s*.7,'#8a857c');rc(x,y,s,.5,'#b5b0a4');rc(x,y+s*.7,s+.5,.5,'#4a4640')}
    for(let i=0;i<16;i++){const x=h01(i*23+7)*W,y=top+3+h01(i*29)*(bot-top-6);line(x,y,x+3+h01(i)*3,y+h01(i+1)*2-1,shade(B.road,-36))}
    for(let i=0;i<110;i++){const x=h01(i*31+9)*W,y=top+eT(x)+.5,hh=1.5+h01(i)*2;rc(x,y-hh,.5,hh,shade(B.g2,i%2?-14:10));rc(x+.7,y-hh+.5,.5,hh-.5,shade(B.g1,20))}
    for(let i=0;i<110;i++){const x=h01(i*37+11)*W,y=bot+eB(x)+.5,hh=1.5+h01(i)*2;rc(x,y-hh,.5,hh,shade(B.g2,i%2?-14:10))}
    for(let i=0;i<34;i++){const x=h01(i*41+13)*W,y=3+h01(i*43)*9,k=i%4;
      if(k===0){rc(x,y,.5,2,'#4a6a30');rc(x-.5,y-1,1.5,1,i%2?'#e8c84a':'#e0709a')}
      else if(k===1){rc(x,y,1,1,'#f2ead2');rc(x-.5,y-.5,2,.5,'#b9483e')}
      else if(k===2)rock(x,y+1,.5+h01(i)*.4,'#8a877f')
      else{rc(x,y,2,1.5,shade(B.g2,-18));rc(x+.5,y-.5,1,.5,shade(B.g2,10))}}
    for(let i=0;i<150;i++){const x=h01(i*47+17)*W,y=44+h01(i*53)*34,hh=2+h01(i*59)*5;const gc=shade(B.g2,-24+h01(i)*34);rc(x,y-hh,.5,hh,gc);rc(x+.7,y-hh+1,.5,hh-1,shade(gc,-14));rc(x-.7,y-hh+2,.5,hh-2,shade(gc,10))}
    for(let i=0;i<30;i++){const x=h01(i*61+19)*W,y=46+h01(i*67)*30;rc(x,y,1,1,i%3?'#e8c84a':'#e0709a');rc(x+.5,y+1,.5,2,'#3a5a28')}

function campComps(obj){
  if(obj._cp)return obj._cp;
  const w=obj.width,h=obj.height,d=obj.getContext('2d').getImageData(0,0,w,h).data,gw=w>>1,gh=h>>1,m=new Uint8Array(gw*gh);
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){if(d[((y*2)*w+x*2)*4+3]>40)m[y*gw+x]=1}
  const m2=new Uint8Array(gw*gh);
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++)if(m[y*gw+x])for(let k=-3;k<=3;k++){const xx=x+k;if(xx>=0&&xx<gw)m2[y*gw+xx]=1}
  const lab=new Int32Array(gw*gh),out=[];let n=0;
  for(let i=0;i<gw*gh;i++){if(!m2[i]||lab[i])continue;n++;const st=[i];lab[i]=n;let maxY=0;
    while(st.length){const p=st.pop(),x=p%gw,y=(p/gw)|0;if(m[p]&&y>maxY)maxY=y;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=gw||yy>=gh)continue;const j=yy*gw+xx;if(m2[j]&&!lab[j]){lab[j]=n;st.push(j)}}}
    out.push({n,gy:maxY+1})}
  const res=[];
  for(const q of out){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d'),id=x.createImageData(w,h);let cnt=0;
    for(let y=0;y<gh;y++)for(let xx=0;xx<gw;xx++){if(m[y*gw+xx]&&lab[y*gw+xx]===q.n){cnt++;for(let a=0;a<2;a++)for(let b=0;b<2;b++){const k=(((y*2+a)*w)+xx*2+b)*4;id.data[k]=d[k];id.data[k+1]=d[k+1];id.data[k+2]=d[k+2];id.data[k+3]=d[k+3]}}}
    if(cnt<6)continue;x.putImageData(id,0,0);res.push({img:cv,gy:q.gy})}
  return obj._cp=res;
}

  const [sx,sy]=sunPos(h),inten=(1-nf)*(.35+.65*Math.sin(sunF(h)*Math.PI)),warm=sunF(h)<.12||sunF(h)>.88;
  c.save();c.globalCompositeOperation='lighter';
  for(let r=230,i=0;r>40;r-=28,i++){c.globalAlpha=.05*inten*(i+1)*.5;disc(sx,sy+50,r,warm?'#3a1608':'#352408')}
  c.restore();
}
function fireLight(h){
  const nf=nightF(h),k0=.3+.7*nf;
  c.save();c.globalCompositeOperation='lighter';
  for(const [x,y,r,k] of LIGHTS){
    const fl=1+Math.sin(TNOW*9+x)*.04+Math.sin(TNOW*17+y)*.03;
    for(let i=0;i<7;i++){const rr=r*fl*(1-i*.125);c.globalAlpha=Math.min(.22,.045*k*k0*(1+i*.18));disc(x,y,Math.round(rr),i<3?'#40180a':(i<5?'#5a2c0c':'#6a4012'))}
  }
  c.restore();c.globalAlpha=1;
}
function moonLight(h){
  const nf=nightF(h);if(nf<.4)return;const [mx,my]=moonPos(h);
  c.save();c.globalCompositeOperation='lighter';c.globalAlpha=.06*nf;
  for(let r=200;r>50;r-=30){disc(mx,my+60,r,'#10183a')}c.restore();
}
function finishFrame(h){
  fireLight(h);
  lockPalette(ctxMain,640,360,1.1);
  LIGHTS=[];
}

const bar=(l,v,m,col)=>`<div class="bar" title="${l}"><b>${l.split(" ")[0]}</b><div class="tr"><i style="width:${Math.max(0,Math.min(100,v/m*100))}%;background:var(${col})"></i></div><em>${Math.round(v)}/${m}</em></div>`;
const FXE={sangramento:'🩸',atordoamento:'💫',fogo:'🔥',veneno:'☠️',gelo:'❄️',trovao:'⚡'};
const gdesc=o=>o.k==='sc'?`<span style="color:#c9a0ff">${o.n}</span> <small>Encantamento ${FXE[o.fx]||''} · use na bigorna</small>`:o.k==='w'?`<span style="color:${RAR[o.ri].c}">${o.n}</span> <small>${RAR[o.ri].n} · nv ${o.lvl} · dano ${o.a+o.lvl-1}-${o.b+o.lvl-1}${o.fx?' · '+o.fx:''} · dur ${durP(o)}</small>`:`<span>${o.n}</span> <small>${SLOTN[o.k]||'Armadura'} · defesa ${o.def} · dur ${durP(o)}</small>`;
const cost=cc=>Object.entries(cc).map(([k,n])=>`<span style="color:${have(k)>=n?'var(--moss)':'var(--blood)'}">${n} ${nm(k)}</span>`).join(', ');
const V={};
V.pack=()=>{
  const cb=G.view==='combat';
  let h=`<section class="card"><h3>Inventário <small>peso ${weight()}/${cap()} · ${fmtCoins(G.coins)}</small></h3>`;
  h+=`<div class="row"><span class="l"><small>Arma</small><br>${G.wep?gdesc(G.wep):'Punhos'}</span>${G.wep&&!cb?`<span class="r"><button class="sm" data-a="unequip" data-v="wep">Tirar</button></span>`:''}</div>${[['arm','Peitoral'],['helm','Elmo'],['cape','Capa'],['shield','Escudo'],['pants','Calça']].map(([s,l])=>`<div class="row"><span class="l"><small>${l}</small><br>${G[s]?gdesc(G[s]):'—'}</span>${G[s]&&!cb?`<span class="r"><button class="sm" data-a="unequip" data-v="${s}">Tirar</button></span>`:''}</div>`).join('')}`;
  for(const o of G.bag)h+=`<div class="row"><span class="l">${gdesc(o)}</span><span class="r">${o.dur>0?`<button class="sm" data-a="equip" data-v="${o.id}" ${cb?'disabled':''}>Equipar</button>`:'<small class="dim">Quebrado </small>'}<button class="sm" data-a="dropg" data-v="${o.id}">Largar</button></span></div>`;
  const ks=Object.keys(G.inv);
  if(!ks.length)h+=`<p class="dim" style="margin-top:8px">Nenhum item no inventário.</p>`;
  for(const k of ks){const it=IT[k],u=it.food||it.water||it.heal||k==='holy';
    h+=`<div class="row"><span class="l">${it.i} ${it.n} <small>×${G.inv[k]}</small></span><span class="r">${u?`<button class="sm" data-a="use" data-v="${k}" ${cb?'disabled':''}>Usar</button>`:''}<button class="sm" data-a="drop" data-v="${k}">Largar</button></span></div>`}
  return h+`<div class="btns"><button data-a="close">Fechar</button></div></section>`;
};
V.chest=()=>{
  let h=`<section class="card"><h2>Depósito</h2><p class="dim">Guarde o que não precisa carregar. Não há limite de peso, mas a comida apodrece com o tempo.</p>`;
  const ks=Object.keys(G.chest.inv);
  h+=`<h3>No depósito</h3>`;
  if(!ks.length&&!G.chest.bag.length)h+='<p class="dim">Vazio.</p>';
  for(const k of ks)h+=`<div class="row"><span class="l">${IT[k].i} ${IT[k].n} <small>×${G.chest.inv[k]}</small></span><span class="r"><button class="sm" data-a="take" data-v="${k}:1">Pegar 1</button><button class="sm" data-a="take" data-v="${k}:all">Todos</button></span></div>`;
  for(const o of G.chest.bag)h+=`<div class="row"><span class="l">${gdesc(o)}</span><span class="r"><button class="sm" data-a="takeg" data-v="${o.id}">Pegar</button></span></div>`;
  h+=`<h3 style="margin-top:12px">No inventário <small>peso ${weight()}/${cap()}</small></h3>`;
  for(const k of Object.keys(G.inv))h+=`<div class="row"><span class="l">${IT[k].i} ${IT[k].n} <small>×${G.inv[k]}</small></span><span class="r"><button class="sm" data-a="store" data-v="${k}:1">Guardar 1</button><button class="sm" data-a="store" data-v="${k}:all">Todos</button></span></div>`;
  for(const o of G.bag)h+=`<div class="row"><span class="l">${gdesc(o)}</span><span class="r">${o.dur>0?`<button class="sm" data-a="storeg" data-v="${o.id}">Guardar</button>`:'<small class="dim">Quebrado</small>'}</span></div>`;
  return h+`<div class="btns"><button data-a="close">Fechar</button></div></section>`;
};
V.upgrade=()=>{
  let h=`<section class="card"><h2>Melhorias</h2><div class="tabs"><button class="${G.utab==='build'?'on':''}" data-a="utab" data-v="build">Construir</button><button class="${G.utab==='craft'?'on':''}" data-a="utab" data-v="craft">Fabricar</button></div>`;
  if(G.utab==='build'){
    h+=`<div class="grid2">`;
    for(const[k,b]of Object.entries(BUILD)){const ok=Object.entries(b.cost).every(([i,n])=>have(i)>=n);
      h+=`<div class="opt"><h4>${b.n} ${G.b[k]?'<small>(construído)</small>':''}</h4><p class="dim" style="margin:0 0 4px">${b.d}</p><p style="margin:0 0 6px;font-size:14px">${cost(b.cost)} · 2h</p>${G.b[k]?'':`<button class="sm ${ok?'pri':''}" data-a="built" data-v="${k}" ${ok?'':'disabled'}>Construir</button>`}</div>`}
    h+='</div>';
  }else{
    h+=`<p class="dim">Usa itens do inventário e do depósito. Itens de consumo vão para o depósito.</p><div class="grid2">`;
    for(const r of RECIPES){const ok=Object.entries(r.need).every(([k,n])=>have(k)>=n)&&(!r.forge||G.b.forge)&&(!r.repair||(G.wep&&G.wep.dur<G.wep.max));
      h+=`<div class="opt"><h4>${r.n}</h4><p class="dim" style="margin:0 0 6px">${cost(r.need)}${r.forge?' · exige Ferraria':''}${r.h?' · '+r.h+'h':''}</p><button class="sm ${ok?'pri':''}" data-a="make" data-v="${r.id}" ${ok?'':'disabled'}>Fazer</button></div>`}
    h+='</div>';
  }
  return h+`<div class="btns"><button data-a="close">Fechar</button></div></section>`;
};
V.trade=()=>{
  const T=G.trade;
  let h=`<section class="card"><h2>${T.name}</h2><p class="dim">Ele tem ${T.tc} cobre e compra por 80% do valor.</p><h3>Comprar <small>${fmtCoins(G.coins)}</small></h3><div class="mscroll big tl" data-sc="tb">`;
  T.stock.forEach((s,i)=>{const label=s.gear?gdesc(s.gear):`${IT[s.key].i} ${IT[s.key].n}`;
    h+=`<div class="row"><span class="l">${label} <small>×${s.q}</small></span><span class="r"><button class="sm" data-a="buy" data-v="${i}" ${s.q<1||G.coins<s.p?'disabled':''}>${COIN_CU()} ${s.p}</button></span></div>`});
  h+=`</div><h3 style="margin-top:12px">Vender</h3><div class="mscroll big tl" data-sc="ts">`;
  const ks=Object.keys(G.inv).filter(k=>IT[k].sell>0);
  if(!ks.length&&!G.bag.length)h+='<p class="dim">Nada para vender.</p>';
  for(const k of ks)h+=`<div class="row"><span class="l">${IT[k].i} ${IT[k].n} <small>×${G.inv[k]}</small></span><span class="r"><button class="sm" data-a="sell" data-v="${k}">${COIN_CU()} ${Math.round(IT[k].sell*.8)||1}</button></span></div>`;
  for(const o of G.bag)h+=`<div class="row"><span class="l">${gdesc(o)}</span><span class="r"><button class="sm" data-a="sell" data-v="g:${o.id}">${COIN_CU()} ${Math.round(gv(o)*.6)}</button></span></div>`;
  return h+`</div><div class="btns"><button data-a="close">Fechar</button></div></section>`;
};

/* ===== salvamento na nuvem (db privado do usuário) ===== */
var CL={db:null,id:null,ready:false,to:0};
function cloudRef(k){return CL.db.doc('data/users/'+CL.id+'/slot'+k.slice(-1))}
function cloudPush(now){
  if(!CL.ready)return;clearTimeout(CL.to);
  const go=()=>{try{const k=KEY,s=localStorage.getItem(k);if(!s)return;cloudRef(k).set({s,t:+localStorage.getItem(k+'-t')||Date.now()}).catch(()=>{})}catch(e){}};
  if(now)go();else CL.to=setTimeout(go,2500);
}
function cloudDel(k){try{if(CL.ready)cloudRef(k).delete().catch(()=>{});try{localStorage.removeItem(k+'-t')}catch(e){}}catch(e){}}
async function cloudInit(){
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use('db'),us=await window.claude.use('user');
    if(!db||!us)return;const id=await us.id();if(!id)return;
    CL.db=db;CL.id=id;let pulled=false;
    for(let n=1;n<=3;n++){
      const k='ashes-slot-'+n,ref=db.doc('data/users/'+id+'/slot'+n);
      let snap=null;try{snap=await ref.get()}catch(e){continue}
      let lt=0,ls=null;try{lt=+localStorage.getItem(k+'-t')||0;ls=localStorage.getItem(k)}catch(e){}
      const d=snap&&snap.exists?snap.data():null;
      if(d&&d.s&&((+d.t>lt)||!ls)&&!(G&&k===KEY)){try{localStorage.setItem(k,d.s);localStorage.setItem(k+'-t',String(d.t||Date.now()))}catch(e){}pulled=true}
      else if(ls&&(!d||lt>+d.t)){try{await ref.set({s:ls,t:lt||Date.now()})}catch(e){}}
    }
    CL.ready=true;if(pulled&&!G)render();else if(G)cloudPush();
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cloudPush(true)});
window.addEventListener('pagehide',()=>cloudPush(true));
cloudInit();
